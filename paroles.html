<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paroles — HarmoHub</title>
<!-- Outil compagnon volontairement À PART de HarmoHub (script.js/style.css) : reçoit juste un petit
     JSON exporté depuis l'appli principale (voir #export-lyrics/exportLyricsData dans script.js) et
     place des accords sur du texte, à la main, ligne par ligne. Rien d'autre en commun avec l'appli
     principale — ni son moteur harmonique, ni son séquenceur, ni sa grille à largeur de temps fixe
     (voir paroles.js pour le pourquoi de ce découplage : la largeur d'une mesure ne correspond jamais
     à la largeur d'un mot, inutile de forcer les deux outils à partager la même contrainte). -->
<link rel="stylesheet" href="paroles.css?v=4">
</head>
<body>
    <header class="top-bar">
        <div class="top-left">
            <!-- Simple lien de retour (pas window.close()) : marche que cette page ait été ouverte
                 depuis HarmoHub (nouvel onglet, voir exportLyricsData) OU directement (favori, URL
                 tapée à la main) — un onglet qui ne vient pas d'un script ne se fermerait pas. -->
            <a href="index.html" class="btn-back" title="Retourner à HarmoHub">← HarmoHub</a>
            <h1>🎤 Paroles</h1>
        </div>
        <div class="top-actions">
            <span id="save-status" class="save-status"></span>
            <span id="song-name" class="song-name" hidden></span>
            <button type="button" id="btn-import" class="btn-primary">Importer un fichier</button>
            <input type="file" id="file-input" accept="application/json,.json" hidden>
            <button type="button" id="btn-export-text" class="btn-secondary" hidden title="Télécharge un fichier texte (accords au-dessus des paroles), lisible partout">📄 Exporter en texte</button>
            <button type="button" id="btn-print" class="btn-secondary" hidden title="Imprimer / exporter en PDF via la boîte d'impression du navigateur">🖨️ Imprimer</button>
        </div>
    </header>

    <div id="banners" class="banners"></div>

    <main id="app-main">
        <div id="empty-state" class="empty-state">
            <p>Importe le fichier téléchargé depuis HarmoHub (bouton <strong>« Exporter pour paroles »</strong>, à côté des exports PDF/MIDI/MP3) pour commencer.</p>
        </div>
        <div id="toolbar" class="toolbar" hidden>
            <div class="mode-toggle">
                <button type="button" id="mode-syllable" class="mode-btn active" title="Les accords s'accrochent au caractère le plus proche (syllabe) — reste aligné même si le texte se redispose">Syllabe</button>
                <button type="button" id="mode-free" class="mode-btn" title="Pose l'accord n'importe où, sans accrochage — utile en fin de ligne ou dans un blanc">Libre</button>
            </div>
            <div id="armed-hint" class="armed-hint" hidden></div>
        </div>
        <div id="sections"></div>
    </main>

    <script src="paroles.js?v=4"></script>
</body>
</html>
