<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paroles — HarmoHub</title>
<!-- Mêmes icônes d'onglet que HarmoHub (voir index.html) : cet outil est un COMPAGNON de HarmoHub, pas
     une appli à part aux yeux de l'utilisateur — l'onglet doit le montrer d'un coup d'œil. -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=202607252000">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=202607252000">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=202607252000">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=202607252000">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Outil compagnon volontairement À PART de HarmoHub (script.js/style.css) : reçoit juste un petit
     JSON exporté depuis l'appli principale (voir #export-lyrics/exportLyricsData dans script.js) et
     place des accords sur du texte, à la main, ligne par ligne. Rien d'autre en commun côté CODE avec
     l'appli principale — ni son moteur harmonique, ni son séquenceur, ni sa grille à largeur de temps
     fixe (voir paroles.js pour le pourquoi de ce découplage) — mais l'HABILLAGE (couleurs, dégradés de
     boutons, logo, icônes SVG plutôt qu'émojis) est repris à la main de style.css pour que ça reste
     visiblement le MÊME produit (retour utilisateur : "optimise le design pour que ça colle au design
     HarmoHub, utilisation de logos, couleurs pastel"). -->
<link rel="stylesheet" href="paroles.css?v=15">
</head>
<body>
    <header class="top-bar">
        <div class="top-left">
            <!-- Simple lien de retour (pas window.close()) : marche que cette page ait été ouverte
                 depuis HarmoHub (nouvel onglet, voir exportLyricsData) OU directement (favori, URL
                 tapée à la main) — un onglet qui ne vient pas d'un script ne se fermerait pas. -->
            <a href="index.html" class="btn-back" title="Retourner à HarmoHub" aria-label="Retourner à HarmoHub">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                HarmoHub
            </a>
            <!-- Même logo « grille en dégradé » que le coin haut-droit de HarmoHub (voir .logo-mark
                 dans index.html) : signale d'un coup d'œil que Paroles fait partie de la même appli,
                 pas un outil tiers séparé. -->
            <h1>
                <span class="logo-mark">
                    <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
                        <rect x="5" y="6" width="8" height="36" rx="3" fill="currentColor" opacity=".25"/>
                        <rect x="15" y="6" width="8" height="36" rx="3" fill="currentColor" opacity=".5"/>
                        <rect x="25" y="6" width="8" height="36" rx="3" fill="currentColor" opacity=".75"/>
                        <rect x="35" y="6" width="8" height="36" rx="3" fill="currentColor"/>
                    </svg>
                </span>
                Paroles
            </h1>
        </div>
        <div class="top-actions">
            <span id="save-status" class="save-status"></span>
            <span id="song-name" class="song-name" hidden></span>
            <!-- Icône seule (retour utilisateur : "les boutons import export etc sont trop gros, il
                 faut les mettre en haut à droite avec logos uniquement") — le libellé reste en
                 title/aria-label pour l'info-bulle et les lecteurs d'écran, comme les boutons d'export
                 de HarmoHub lui-même (PDF/MIDI/MP3, voir index.html). -->
            <button type="button" id="btn-import" class="btn-primary header-icon-btn" title="Importer un fichier" aria-label="Importer un fichier">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="m7 13 5-5 5 5"/><path d="M5 3h14"/></svg>
            </button>
            <input type="file" id="file-input" accept="application/json,.json" hidden>
            <button type="button" id="btn-export-text" class="btn-secondary header-icon-btn" hidden title="Exporter en texte — télécharge un fichier texte (accords au-dessus des paroles), lisible partout" aria-label="Exporter en texte">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
            </button>
            <!-- Copier-coller rapide (retour utilisateur : "je voudrais copier le texte écrit dans ce
                 module, si je veux le mettre dans un Word à part") — même contenu que le fichier .txt
                 juste au-dessus (voir buildPlainTextExport, partagé), mais direct dans le presse-papiers
                 plutôt qu'un fichier à réouvrir. Icône "deux feuilles" classique du copier-coller. -->
            <button type="button" id="btn-copy-text" class="btn-secondary header-icon-btn" hidden title="Copier le texte dans le presse-papiers" aria-label="Copier le texte dans le presse-papiers">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <!-- Vrai PDF téléchargeable (jsPDF + html2canvas, même recette que exportPdf dans
                 script.js de HarmoHub — voir plus bas) plutôt que la seule boîte d'impression du
                 navigateur : retour utilisateur, les accords (pastilles positionnées) n'en ressortaient
                 pas correctement, "je vois que le texte". Même icône que l'export PDF de HarmoHub. -->
            <button type="button" id="btn-export-pdf" class="btn-secondary header-icon-btn" hidden title="Enregistrer en PDF" aria-label="Enregistrer en PDF">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
            </button>
        </div>
    </header>

    <div id="banners" class="banners"></div>

    <main id="app-main">
        <div id="empty-state" class="empty-state">
            <p>Importe le fichier téléchargé depuis HarmoHub (bouton <strong>« Exporter pour paroles »</strong>, à côté des exports PDF/MIDI/MP3) pour commencer.</p>
        </div>
        <div id="toolbar" class="toolbar" hidden>
            <div class="toolbar-left">
                <div class="mode-toggle">
                    <button type="button" id="mode-syllable" class="mode-btn active" title="Les accords s'accrochent au caractère le plus proche (syllabe) — reste aligné même si le texte se redispose">Syllabe</button>
                    <button type="button" id="mode-free" class="mode-btn" title="Position horizontale libre, sans accrochage à un caractère — la hauteur reste toujours celle de la ligne visée">Libre</button>
                </div>
                <div class="history-controls">
                    <!-- Mêmes tracés que #global-undo-btn/#global-redo-btn dans index.html : le même
                         geste (Ctrl+Z) doit avoir la même icône partout dans l'appli. -->
                    <button type="button" id="btn-undo" class="mode-btn icon-only" disabled title="Annuler (Ctrl+Z)" aria-label="Annuler">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                    </button>
                    <button type="button" id="btn-redo" class="mode-btn icon-only" disabled title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
                    </button>
                </div>
            </div>
            <div id="armed-hint" class="armed-hint" hidden></div>
            <button type="button" id="btn-options" class="mode-btn" title="Options d'affichage">
                <!-- Même roue crantée que #open-settings dans index.html : « les réglages », dans
                     Paroles comme dans HarmoHub, c'est toujours cette icône. -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.04.05a2 2 0 1 1-2.83 2.83l-.05-.04a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.05.04a2 2 0 1 1-2.83-2.83l.04-.05a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.04-.05a2 2 0 1 1 2.83-2.83l.05.04a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82.33l.05-.04a2 2 0 1 1 2.83 2.83l-.04.05a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
                </svg>
                Options
            </button>
        </div>
        <div id="options-panel" class="options-panel" hidden>
            <label class="option-row">
                <span>Taille du texte</span>
                <input type="range" id="opt-font-size" min="0.8" max="1.6" step="0.1" value="1">
                <span id="opt-font-size-value" class="option-value">100%</span>
            </label>
            <!-- Voir prefs.chain dans paroles.js : les accords d'une partie se posent presque toujours
                 dans l'ordre où ils sont joués, donc passer tout seul au suivant divise par deux le
                 nombre de clics. Décocher pour reposer plusieurs fois le même accord d'affilée. -->
            <label class="option-row option-row-check">
                <input type="checkbox" id="opt-chain" checked>
                <span>Enchaîner les accords</span>
                <span class="option-help">Après avoir posé un accord, passe automatiquement au suivant de la partie. Décoche pour poser plusieurs fois le même.</span>
            </label>
        </div>
        <div id="sections"></div>
    </main>

    <!-- jsPDF + html2canvas, vendus en local comme dans HarmoHub (voir script.js) — utilisés
         uniquement par l'export PDF (voir exportLyricsPdf dans paroles.js). Licences MIT/dérivées,
         mêmes fichiers que ceux de l'appli principale, réutilisés à l'identique. -->
    <script src="html2canvas.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    <script src="paroles.js?v=16"></script>
</body>
</html>
